<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oshi Mark</title>
    <link rel="stylesheet" href="src/output.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
    <div class="grid grid-cols-4 w-[1400px] mx-auto">
        <div class="h-screen flex flex-col justify-between px-[2rem] pb-[2rem] pt-[1rem]">
            <nav class="flex flex-col col-span-1 gap-y-[1.5rem]">
                <img src="img/icons/logo.png" alt="logo" class="w-[2rem] mr-[1.2rem] m-[0.2rem]">
                <div class="flex items-center">
                    <img src="img/icons/home.png" alt="home" class="w-[2rem] mr-[1.2rem]">
                    <p class="font-medium text-lg text-gray-700">Home</p>
                </div>
                <div class="flex items-center">
                    <img src="img/icons/search.png" alt="search" class="w-[2rem] mr-[1.2rem]">
                    <p class="font-medium text-lg text-gray-700">Search</p>
                </div>
                <div class="flex items-center">
                    <img src="img/icons/bell.png" alt="notifications" class="w-[2rem] mr-[1.2rem]">
                    <p class="font-medium text-lg text-gray-700">Notifications</p>
                </div>
                <div class="flex items-center">
                    <img src="img/icons/mail.png" alt="messages" class="w-[2rem] mr-[1.2rem]">
                    <p class="font-medium text-lg text-gray-700">Messages</p>
                </div>
                <div class="flex items-center">
                    <img src="img/icons/bookmark.png" alt="bookmarks" class="w-[2rem] mr-[1.2rem]">
                    <p class="font-medium text-lg text-gray-700">Bookmarks</p>
                </div>
                <div class="flex items-center">
                    <img src="img/icons/group.png" alt="circle" class="w-[2rem] mr-[1.2rem]">
                    <p class="font-medium text-lg text-gray-700">Circle</p>
                </div>
                <div class="flex items-center">
                    <img src="img/icons/person.png" alt="profile" class="w-[2rem] mr-[1.2rem]">
                    <p class="font-medium text-lg text-gray-700">Profile</p>
                </div>
                <div class="flex items-center">
                    <img src="img/icons/settings.png" alt="settings" class="w-[2rem] mr-[1.2rem]">
                    <p class=" font-medium text-lg text-gray-700">Settings and Privacy</p>
                </div>
                <button class="bg-pink-200 rounded-3xl px-[3rem] py-[1rem] w-[14rem] self-center font-medium text-lg">Post</button>
            </nav>
            <div class="flex items-center self-center justify-self-end">
                <img src="img/profile-assets/pfp.JPG" alt="profile picture" class="rounded-full w-[4rem] p-[0.6rem]">
                <div class="self-center">
                    <p class="font-bold text-gray-700">Anonymous</p>
                    <p class="text-gray-700">@anon_user46017</p>
                </div>
                <img src="img/icons/more.png" alt="more" class="w-[2rem] ml-[2rem]">
            </div>
        </div>
    </div>
</body>
</html>
